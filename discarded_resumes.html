<!DOCTYPE html>
<html>
<head>
    <title>Discarded Resumes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin-top: 40px;
            font-size: 28px;
            color: #2c3e50;
        }

        .button {
            display: inline-block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #5C5C99;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        .button:hover {
            background-color: #1a252f;
        }

        .table-container {
            display: flex;
            justify-content: center;
        }

        table {
            width: 90%;
            margin: 0 auto 40px;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.05);
        }

        th, td {
            padding: 12px 16px;
            border: 1px solid #ddd;
            text-align: left;
            font-size: 14px;
        }

        th {
        background-color: #292966;
        color: white;
        }

        a {
            color: #5c5cb4;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .no-data {
            text-align: center;
            margin-top: 50px;
            font-size: 16px;
            color: #999;
        }
    </style>
</head>
<body>

    <h2>Discarded Resumes</h2>

   <div style="margin-left: 65px; text-align: left;">
    <a href="/leaderboard" class="button">← Back to Leaderboard</a>
   </div>


    {% if is_empty %}
        <p class="no-data">⚠️ No discarded resumes to display.</p>
    {% else %}
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Resume Link</th>
                    <th>Removal Reason</th>
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr>
                    <td>{{ row.name }}</td>
                    <td>{{ row.email }}</td>
                    <td>{{ row.phone_number }}</td>
                    <td><a href="{{ row.resume_link }}" target="_blank">View Resume</a></td>
                    <td>{{ row.removal_reason }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% endif %}

</body>
</html>
